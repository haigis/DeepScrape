<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DeepScrape — Page Detail</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/app.css">
  <style>
    /* Page-specific styles layered on the shared visual language. */
    .graph-panel { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 6px; overflow-x: auto; }
    .graph-hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
    .g-center rect { fill: var(--ink); }
    .g-center text { fill: #fff; font-weight: bold; }
    .g-in rect { fill: #e6f4ec; stroke: #1a8a4a; }
    .g-out rect { fill: #e8f1fc; stroke: #0b6bcb; }
    .g-out.broken rect { fill: #fdeaea; stroke: #c62828; }
    .g-out.external rect { fill: #f3eefe; stroke: #8a3ffc; }
    .gnode rect { rx: 4; stroke-width: 1.2; }
    .col-title { fill: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      margin: 0;
      color: #333;
    }
    header {
      background: #007bff;
      color: white;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    header a { color: #cfe5ff; text-decoration: none; font-size: 14px; }
    header a:hover { text-decoration: underline; }
    header h1 { font-size: 16px; margin: 0; font-weight: normal; word-break: break-all; }

    .wrap { max-width: 1100px; margin: 0 auto; padding: 20px; }

    .top { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
    .info { flex: 1; min-width: 300px; }

    .page-title { font-size: 20px; font-weight: bold; color: #234; word-break: break-all; margin: 0 0 6px; }
    .orig-url { font-size: 14px; margin-bottom: 14px; word-break: break-all; }
    .orig-url a { color: #007bff; text-decoration: none; }
    .orig-url a:hover { text-decoration: underline; }

    .stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .stat {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px 16px;
      min-width: 100px;
      text-align: center;
    }
    .stat .num { font-size: 20px; font-weight: bold; color: #007bff; }
    .stat .label { font-size: 12px; color: #667; }

    .actions { margin-bottom: 16px; }
    .actions a {
      display: inline-block;
      margin: 0 8px 8px 0;
      background: #007bff;
      border-radius: 5px;
      padding: 8px 14px;
      color: white;
      text-decoration: none;
      font-size: 14px;
    }
    .actions a.secondary { background: #fff; color: #007bff; border: 1px solid #cfe0f0; }
    .actions a:hover { opacity: 0.9; }

    .shot {
      width: 340px;
      max-width: 100%;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fafafa;
      cursor: zoom-in;
      object-fit: cover;
      object-position: top;
      max-height: 420px;
    }

    section { margin-top: 26px; }
    section h2 { font-size: 16px; color: #234; margin: 0 0 10px; }

    table.history {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.06);
    }
    table.history th, table.history td {
      padding: 9px 12px;
      border-bottom: 1px solid #eee;
      text-align: left;
      font-size: 14px;
    }
    table.history th { background: #f0f4f8; color: #234; }
    table.history a { color: #007bff; text-decoration: none; font-weight: bold; }
    table.history a:hover { text-decoration: underline; }
    tr.current { background: #eef5ff; }
    .delta-up { color: #d60000; }
    .delta-down { color: #1a8a1a; }
    .delta-none { color: #999; }

    /* Link analysis */
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .tab {
      background: #fff; border: 1px solid #cfe0f0; border-radius: 5px;
      padding: 6px 12px; font-size: 13px; color: #007bff; cursor: pointer;
    }
    .tab:hover { background: #eef5ff; }
    .tab.active { background: #007bff; color: #fff; border-color: #007bff; }
    .tab .n { opacity: 0.75; margin-left: 4px; }

    .linkfilter {
      width: 100%; padding: 7px; border: 1px solid #ccc;
      border-radius: 5px; font-size: 13px; margin-bottom: 10px;
    }
    table.links {
      width: 100%; border-collapse: collapse; background: #fff;
      border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.06);
    }
    table.links th, table.links td {
      padding: 8px 10px; border-bottom: 1px solid #eee;
      text-align: left; font-size: 13px; vertical-align: top;
    }
    table.links th { background: #f0f4f8; color: #234; white-space: nowrap; }
    table.links td.url { word-break: break-all; }
    table.links a { color: #007bff; text-decoration: none; }
    table.links a:hover { text-decoration: underline; }
    .anchor-text { color: #234; font-weight: bold; }
    .anchor-none { color: #aaa; font-style: italic; }
    .badge {
      display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px;
      margin-right: 4px; white-space: nowrap;
    }
    .b-ok { background: #e6f5e6; color: #1a7a1a; }
    .b-missing { background: #fff2d9; color: #8a6100; }
    .b-broken { background: #fdeaea; color: #c00; }
    .b-nofollow { background: #eee; color: #666; }
    .b-count { background: #eef2f7; color: #456; }
    .hostbar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .hostchip {
      background: #fff; border: 1px solid #ddd; border-radius: 12px;
      padding: 3px 10px; font-size: 12px; color: #345; cursor: pointer;
    }
    .hostchip:hover { border-color: #007bff; color: #007bff; }
    .hostchip.active { background: #007bff; color: #fff; border-color: #007bff; }
    .empty { color: #999; padding: 12px; }
    .note { color: #888; font-size: 12px; margin-top: 8px; }

    /* SEO / metadata panel */
    .seo { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 0; overflow: hidden; }
    .seo-status {
      padding: 10px 14px; font-size: 14px; font-weight: bold;
      border-bottom: 1px solid #eee;
    }
    .s-good { background: #e9f7e9; color: #1a7a1a; }
    .s-warn { background: #fff6e0; color: #8a6100; }
    .s-bad  { background: #fdecec; color: #c00; }
    table.meta { width: 100%; border-collapse: collapse; }
    table.meta th, table.meta td {
      padding: 9px 14px; border-bottom: 1px solid #f0f0f0;
      text-align: left; font-size: 13px; vertical-align: top;
    }
    table.meta th { width: 165px; color: #667; font-weight: normal; white-space: nowrap; }
    table.meta td { color: #234; word-break: break-word; }
    .meta-missing { color: #c00; font-style: italic; }
    .meta-value { font-weight: bold; }
    .charcount { color: #888; font-weight: normal; font-size: 12px; margin-left: 6px; }
    .directive {
      display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 10px;
      margin-right: 4px; background: #fdecec; color: #c00; font-weight: bold;
    }
    .directive.ok { background: #e9f7e9; color: #1a7a1a; }
    .notes { margin: 0; padding: 10px 14px 12px 32px; font-size: 13px; }
    .notes li { margin-bottom: 5px; color: #444; }
    .caveat { padding: 8px 14px 12px; font-size: 12px; color: #888; }

    /* Re-scan panel */
    .rescan {
      background: #fff; border: 1px solid #ddd; border-radius: 8px;
      padding: 14px; margin-top: 8px;
    }
    .rescan label {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 13px; margin-right: 14px; margin-bottom: 8px;
    }
    .rescan input[type=number] { width: 90px; padding: 5px; font-size: 13px; }
    .rescan button {
      background: #007bff; color: #fff; border: none; border-radius: 5px;
      padding: 8px 16px; font-size: 14px; cursor: pointer;
    }
    .rescan button:hover { opacity: 0.9; }
    .rescan button:disabled { background: #9bc4ee; cursor: default; }
    #rescanStatus { margin-top: 10px; font-family: monospace; font-size: 13px; white-space: pre-wrap; }

    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 10;
      justify-content: center;
      align-items: flex-start;
      overflow-y: auto;
      padding: 30px;
      cursor: zoom-out;
    }
    #lightbox img { max-width: 95%; border-radius: 6px; box-shadow: 0 4px 30px rgba(0,0,0,0.5); }
    .placeholder { color: #888; text-align: center; margin-top: 60px; }
  </style>
</head>
<body>

  <header class="topbar">
    <a class="brand" href="/dashboard.html">⚽ DeepScrape</a>
    <nav>
      <a href="/dashboard.html" id="navDash">Dashboard</a>
      <a href="/scans.html" id="navTree">Page tree</a>
      <a href="/scan.html">Scan &amp; queue</a>
    </nav>
    <span class="spacer"></span>
    <span class="context" id="crumb">Loading…</span>
  </header>

  <div class="wrap" id="content">
    <p class="placeholder">Loading page details…</p>
  </div>

  <div id="lightbox" onclick="this.style.display='none'"><img id="lightboxImg" alt="Screenshot preview"></div>

  <script>
    const API_URL = "";
    const params = new URLSearchParams(location.search);
    const scan = params.get("scan") || "";
    const pagePath = params.get("path") || "";
    const [domain, scanDate] = scan.split("/");

    const fmtSize = (bytes) => {
      if (bytes == null) return "—";
      if (bytes < 1024) return bytes + " B";
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
      return (bytes / 1024 / 1024).toFixed(2) + " MB";
    };

    const el = (tag, className, text) => {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    };

    async function load() {
      const content = document.getElementById("content");
      if (!scan || !pagePath || !domain || !scanDate) {
        content.innerHTML = "";
        content.appendChild(el("p", "placeholder", "Missing scan or path parameter."));
        return;
      }

      document.getElementById("crumb").textContent = `${domain} · ${scanDate}`;
      document.getElementById("navDash").href = `/dashboard.html?scan=${encodeURIComponent(scan)}`;
      document.getElementById("navTree").href = `/scans.html?scan=${encodeURIComponent(scan)}`;

      try {
        const [pageRes, histRes] = await Promise.all([
          fetch(`${API_URL}/scan/page?scan=${encodeURIComponent(scan)}&path=${encodeURIComponent(pagePath)}`),
          fetch(`${API_URL}/scan/history?domain=${encodeURIComponent(domain)}&path=${encodeURIComponent(pagePath)}`),
        ]);
        if (!pageRes.ok) {
          const err = await pageRes.json().catch(() => ({}));
          throw new Error(err.error || "Failed to load page");
        }
        const page = await pageRes.json();
        const hist = histRes.ok ? (await histRes.json()).history : [];
        render(page, hist);
      } catch (error) {
        content.innerHTML = "";
        content.appendChild(el("p", "placeholder", "Error: " + error.message));
      }
    }

    function render(page, history) {
      const content = document.getElementById("content");
      content.innerHTML = "";

      const top = el("div", "top");
      const info = el("div", "info");

      // Display path relative to the site root (strip the domain folder).
      const displayPath = "/" + page.path.split("/").slice(1).join("/");
      info.appendChild(el("p", "page-title", displayPath));

      const orig = el("p", "orig-url");
      if (page.url) {
        orig.append("Original URL: ");
        const a = el("a", null, page.url);
        a.href = page.url;
        a.target = "_blank";
        a.rel = "noopener";
        orig.appendChild(a);
      } else {
        orig.textContent = "Original URL: unknown";
      }
      info.appendChild(orig);

      // Stats
      const stats = el("div", "stats");
      const defs = [
        [fmtSize(page.size), "HTML size"],
        [page.incoming.length, "Incoming links"],
        [page.outgoing.length, "Outgoing links"],
        [history.length, "Scans"],
      ];
      for (const [num, label] of defs) {
        const s = el("div", "stat");
        s.appendChild(el("div", "num", num));
        s.appendChild(el("div", "label", label));
        stats.appendChild(s);
      }
      info.appendChild(stats);

      // Actions
      const actions = el("div", "actions");
      const aHtml = el("a", null, "View saved HTML");
      aHtml.href = page.htmlUrl;
      aHtml.target = "_blank";
      actions.appendChild(aHtml);
      if (page.screenshotUrl) {
        const aShot = el("a", "secondary", "Open screenshot");
        aShot.href = page.screenshotUrl;
        aShot.target = "_blank";
        actions.appendChild(aShot);
      }
      info.appendChild(actions);
      top.appendChild(info);

      if (page.screenshotUrl) {
        const img = el("img", "shot");
        img.src = page.screenshotUrl;
        img.alt = "Screenshot of " + displayPath;
        img.onclick = () => {
          document.getElementById("lightboxImg").src = page.screenshotUrl;
          document.getElementById("lightbox").style.display = "flex";
        };
        top.appendChild(img);
      }
      content.appendChild(top);

      // History across scans
      const histSection = el("section");
      histSection.appendChild(el("h2", null, `Scan history (${history.length})`));
      if (history.length === 0) {
        histSection.appendChild(el("p", null, "No other scans contain this page."));
      } else {
        const table = el("table", "history");
        const headRow = el("tr");
        for (const h of ["Scan date", "HTML size", "Change", "Links", ""]) {
          headRow.appendChild(el("th", null, h));
        }
        table.appendChild(headRow);

        for (const entry of history) {
          const row = el("tr", entry.scan === scan ? "current" : null);
          row.appendChild(el("td", null, entry.date + (entry.scan === scan ? " (viewing)" : "")));
          row.appendChild(el("td", null, fmtSize(entry.size)));

          const deltaTd = el("td");
          if (entry.sizeDelta == null) {
            deltaTd.appendChild(el("span", "delta-none", "first scan"));
          } else if (entry.sizeDelta === 0) {
            deltaTd.appendChild(el("span", "delta-none", "no change"));
          } else {
            const cls = entry.sizeDelta > 0 ? "delta-up" : "delta-down";
            const sign = entry.sizeDelta > 0 ? "+" : "−";
            deltaTd.appendChild(el("span", cls, sign + fmtSize(Math.abs(entry.sizeDelta))));
          }
          row.appendChild(deltaTd);

          const linksTd = el("td");
          const aH = el("a", null, "HTML");
          aH.href = entry.htmlUrl;
          aH.target = "_blank";
          linksTd.appendChild(aH);
          if (entry.screenshotUrl) {
            linksTd.append(" · ");
            const aS = el("a", null, "Screenshot");
            aS.href = entry.screenshotUrl;
            aS.target = "_blank";
            linksTd.appendChild(aS);
          }
          row.appendChild(linksTd);

          const viewTd = el("td");
          if (entry.scan !== scan) {
            const aV = el("a", null, "View this scan →");
            aV.href = `/page.html?scan=${encodeURIComponent(entry.scan)}&path=${encodeURIComponent(pagePath)}`;
            viewTd.appendChild(aV);
          }
          row.appendChild(viewTd);

          table.appendChild(row);
        }
        histSection.appendChild(table);
      }
      content.appendChild(histSection);

      // On-page metadata and discoverability
      if (page.meta) content.appendChild(renderSeo(page));

      // Re-scan this single page (priority job)
      content.appendChild(renderRescan(page));

      // Link neighbourhood graph — how this page connects to the rest
      content.appendChild(renderGraph(page));

      // Link analysis
      content.appendChild(renderLinks(page.links));
    }

    // --- Link neighbourhood graph ----------------------------------------

    const SVG_NS = "http://www.w3.org/2000/svg";
    const svgEl = (tag, attrs = {}) => {
      const node = document.createElementNS(SVG_NS, tag);
      for (const [k, v] of Object.entries(attrs)) if (v != null) node.setAttribute(k, String(v));
      return node;
    };

    let tipEl = null;
    function showTip(event, title, rows, hint) {
      if (!tipEl) {
        tipEl = el("div");
        tipEl.id = "tooltip";
        document.body.appendChild(tipEl);
      }
      tipEl.innerHTML = "";
      tipEl.appendChild(el("div", "t-title", title));
      for (const r of rows) if (r) tipEl.appendChild(el("div", "t-row", r));
      if (hint) tipEl.appendChild(el("div", "t-hint", hint));
      tipEl.style.display = "block";
      const rect = tipEl.getBoundingClientRect();
      let x = event.clientX + 14, y = event.clientY + 14;
      if (x + rect.width > window.innerWidth - 8) x = event.clientX - rect.width - 14;
      if (y + rect.height > window.innerHeight - 8) y = event.clientY - rect.height - 14;
      tipEl.style.left = Math.max(4, x) + "px";
      tipEl.style.top = Math.max(4, y) + "px";
    }
    const hideTip = () => { if (tipEl) tipEl.style.display = "none"; };

    const shortLabel = (text, max = 34) =>
      text.length > max ? text.slice(0, max - 1) + "…" : text;

    function renderGraph(page) {
      const section = el("section");
      section.appendChild(el("h2", null, "Link neighbourhood"));

      const inbound = page.links.incoming.slice(0, 8);
      const outInternal = page.links.internal.slice(0, 8);
      const outExternal = page.links.external.slice(0, 4);
      const outgoing = [...outInternal, ...outExternal.map(e => ({ ...e, external: true }))];

      if (inbound.length === 0 && outgoing.length === 0) {
        const panel = el("div", "graph-panel");
        panel.appendChild(el("p", "empty", "No links in or out of this page were recorded."));
        section.appendChild(panel);
        return section;
      }

      const rowH = 34;
      const boxW = 240, boxH = 24;
      const width = 980;
      const midX = width / 2;
      const rows = Math.max(inbound.length, outgoing.length, 1);
      const height = Math.max(160, rows * rowH + 70);
      const centreY = height / 2;

      const root = svgEl("svg", {
        class: "chart", viewBox: `0 0 ${width} ${height}`, height,
        preserveAspectRatio: "xMidYMid meet",
      });

      root.appendChild(Object.assign(
        svgEl("text", { class: "col-title", x: 0, y: 16 }),
        { textContent: `Linked from (${page.links.counts.incoming})` }));
      root.appendChild(Object.assign(
        svgEl("text", { class: "col-title", x: width, y: 16, "text-anchor": "end" }),
        { textContent: `Links out (${page.links.counts.internal + page.links.counts.external})` }));

      const edges = [];

      const column = (items, side) => {
        const startY = centreY - ((items.length - 1) * rowH) / 2;
        items.forEach((item, i) => {
          const y = startY + i * rowH;
          const x = side === "in" ? 0 : width - boxW;

          // Edge from/to the centre node.
          const fromX = side === "in" ? boxW : midX + 110;
          const toX = side === "in" ? midX - 110 : width - boxW;
          const fromY = side === "in" ? y : centreY;
          const toY = side === "in" ? centreY : y;
          const edge = svgEl("path", {
            class: "edge",
            d: `M ${fromX} ${fromY} C ${(fromX + toX) / 2} ${fromY}, ${(fromX + toX) / 2} ${toY}, ${toX} ${toY}`,
          });
          root.appendChild(edge);
          edges.push(edge);

          const cls = side === "in"
            ? "gnode g-in"
            : `gnode g-out${item.external ? " external" : ""}${item.broken ? " broken" : ""}`;
          const g = svgEl("g", { class: cls });
          g.appendChild(svgEl("rect", { x, y: y - boxH / 2, width: boxW, height: boxH }));

          const label = item.external
            ? item.host
            : (side === "in"
              ? (item.anchorTexts[0] || sitePathOf(item.path) || item.url)
              : (item.text || sitePathOf(item.path) || item.url));
          g.appendChild(Object.assign(
            svgEl("text", { x: x + 9, y: y + 4 }),
            { textContent: shortLabel(label) }));

          g.addEventListener("mouseenter", (event) => {
            edge.classList.add("hot");
            const rows = side === "in"
              ? [
                  item.url,
                  item.anchorTexts.length ? `Anchor: “${item.anchorTexts.join('”, “')}”` : "(no anchor text)",
                  item.occurrences > 1 ? `Links here ${item.occurrences}×` : null,
                  item.nofollow ? "nofollow" : null,
                ]
              : [
                  item.url,
                  item.text ? `Anchor: “${item.text}”` : "(no anchor text)",
                  item.external ? `External host: ${item.host}` : (item.broken ? "Broken link" : (item.scraped ? "Target scraped" : "Target not scraped")),
                  item.nofollow ? "nofollow" : null,
                ];
            showTip(event, side === "in" ? "Links to this page" : "This page links to",
              rows.filter(Boolean),
              item.pageUrl ? "Click to open that page’s dashboard" : "Click to open the live URL");
          });
          g.addEventListener("mousemove", (event) => {
            if (tipEl && tipEl.style.display === "block") {
              tipEl.style.left = Math.min(event.clientX + 14, window.innerWidth - tipEl.offsetWidth - 8) + "px";
              tipEl.style.top = Math.min(event.clientY + 14, window.innerHeight - tipEl.offsetHeight - 8) + "px";
            }
          });
          g.addEventListener("mouseleave", () => { edge.classList.remove("hot"); hideTip(); });
          g.addEventListener("click", () => {
            hideTip();
            if (item.pageUrl) location.href = item.pageUrl;
            else window.open(item.url, "_blank", "noopener");
          });

          root.appendChild(g);
        });
      };

      column(inbound, "in");
      column(outgoing, "out");

      // Centre node — this page.
      const centre = svgEl("g", { class: "gnode g-center" });
      centre.appendChild(svgEl("rect", { x: midX - 110, y: centreY - 16, width: 220, height: 32 }));
      centre.appendChild(Object.assign(
        svgEl("text", { x: midX, y: centreY + 5, "text-anchor": "middle" }),
        { textContent: shortLabel(sitePathOf(page.path), 30) }));
      root.appendChild(centre);

      const panel = el("div", "graph-panel");
      panel.appendChild(root);
      section.appendChild(panel);

      const hint = el("p", "graph-hint");
      hint.textContent = "Hover a node to highlight its connection and see the anchor text; click to jump to that page’s dashboard. "
        + `Showing up to 8 inbound, 8 internal outbound and 4 external hosts.`;
      section.appendChild(hint);
      return section;
    }

    const sitePathOf = (p) => (p ? "/" + p.split("/").slice(1).join("/") : "");

    // --- On-page metadata & discoverability ------------------------------

    const STATUS_LABELS = {
      "indexable-and-linked": ["s-good", "✅ Indexable and linked internally"],
      "noindex-but-linked": ["s-bad", "🚫 noindex — but still reachable via internal links"],
      "noindex": ["s-warn", "🚫 noindex — excluded from search"],
      "canonicalised-away": ["s-warn", "↪️ Canonical points to another URL"],
      "orphan": ["s-warn", "🔗 Orphan — nothing in this scan links here"],
      "nofollow-links-only": ["s-warn", "⚠️ Only nofollow links point here"],
    };

    function metaRow(table, label, valueNode) {
      const tr = el("tr");
      tr.appendChild(el("th", null, label));
      const td = el("td");
      td.appendChild(valueNode);
      tr.appendChild(td);
      table.appendChild(tr);
    }

    function valueOrMissing(value, missingText, charLimit) {
      if (!value) return el("span", "meta-missing", missingText);
      const span = el("span", "meta-value", value);
      const wrap = el("span");
      wrap.appendChild(span);
      if (charLimit) {
        const count = el("span", "charcount", `${value.length} chars`);
        wrap.appendChild(count);
      }
      return wrap;
    }

    function renderSeo(page) {
      const meta = page.meta;
      const disc = page.discoverability;

      const section = el("section");
      section.appendChild(el("h2", null, "Metadata & discoverability"));

      const box = el("div", "seo");

      const [cls, label] = STATUS_LABELS[disc.status] ?? ["s-warn", disc.status];
      box.appendChild(el("div", `seo-status ${cls}`, label));

      const table = el("table", "meta");

      metaRow(table, "Title", valueOrMissing(meta.title, "missing", true));

      // H1s — zero or several is worth seeing at a glance.
      const h1Cell = el("span");
      if (meta.h1Count === 0) {
        h1Cell.appendChild(el("span", "meta-missing", "missing"));
      } else {
        meta.h1s.forEach((h1, i) => {
          if (i > 0) h1Cell.appendChild(el("br"));
          h1Cell.appendChild(el("span", "meta-value", h1));
        });
        if (meta.h1Count > 1) {
          h1Cell.appendChild(el("span", "charcount", `${meta.h1Count} H1s — expected one`));
        }
      }
      metaRow(table, `H1${meta.h1Count > 1 ? ` (${meta.h1Count})` : ""}`, h1Cell);

      metaRow(table, "Meta description", valueOrMissing(meta.description, "missing", true));

      // Robots directives from meta robots / googlebot.
      const robotsCell = el("span");
      if (meta.robots.directives.length === 0) {
        robotsCell.appendChild(el("span", "directive ok", "index, follow (default)"));
      } else {
        for (const directive of meta.robots.directives) {
          robotsCell.appendChild(el("span", "directive", directive));
        }
      }
      if (meta.robots.raw) robotsCell.appendChild(el("span", "charcount", `robots: "${meta.robots.raw}"`));
      if (meta.robots.googlebot) robotsCell.appendChild(el("span", "charcount", `googlebot: "${meta.robots.googlebot}"`));
      metaRow(table, "Robots", robotsCell);

      // Canonical
      const canonCell = el("span");
      if (!meta.canonical) {
        canonCell.appendChild(el("span", "meta-missing", "none"));
      } else {
        const a = el("a", null, meta.canonical);
        a.href = meta.canonical;
        a.target = "_blank";
        a.rel = "noopener";
        canonCell.appendChild(a);
        canonCell.appendChild(el("span", "charcount",
          disc.canonicalisedAway ? "points elsewhere" : "self-referencing"));
      }
      metaRow(table, "Canonical", canonCell);

      metaRow(table, "Language", meta.lang
        ? el("span", "meta-value", meta.lang)
        : el("span", "meta-missing", "not set"));

      // Discoverability summary from the crawl's link graph.
      const reach = el("span");
      reach.appendChild(el("span", "meta-value",
        `${disc.inboundFollowed} followed`));
      reach.append(` internal link${disc.inboundFollowed === 1 ? "" : "s"} in`);
      if (disc.inboundNofollow > 0) reach.append(` (+${disc.inboundNofollow} nofollow)`);
      reach.append(` · ${disc.internalOutgoing} internal out`);
      metaRow(table, "Internal reach", reach);

      box.appendChild(table);

      if (disc.notes.length) {
        const notes = el("ul", "notes");
        for (const note of disc.notes) notes.appendChild(el("li", null, note));
        box.appendChild(notes);
      }

      box.appendChild(el("div", "caveat",
        "Based on the saved HTML: meta robots only. The HTTP X-Robots-Tag header is not captured at scrape time, so a header-level noindex would not appear here."));

      section.appendChild(box);
      return section;
    }

    // --- Re-scan ---------------------------------------------------------

    function renderRescan(page) {
      const section = el("section");
      section.appendChild(el("h2", null, "Re-scan this page"));

      const box = el("div", "rescan");

      if (!page.url) {
        box.appendChild(el("p", "empty",
          "The original URL could not be read from this saved page, so it cannot be re-scanned."));
        section.appendChild(box);
        return section;
      }

      const rate = el("label", null, "Rate limit (ms) ");
      const rateInput = el("input");
      rateInput.type = "number";
      rateInput.value = "0";
      rateInput.min = "0";
      rate.appendChild(rateInput);
      box.appendChild(rate);

      const shot = el("label", null, "Screenshot");
      const shotInput = el("input");
      shotInput.type = "checkbox";
      shotInput.checked = !!page.screenshotUrl;
      shot.prepend(shotInput);
      box.appendChild(shot);

      const imgs = el("label", null, "Download images");
      const imgsInput = el("input");
      imgsInput.type = "checkbox";
      imgs.prepend(imgsInput);
      box.appendChild(imgs);

      box.appendChild(el("br"));

      const button = el("button", null, "⚡ Re-scan now (priority)");
      const status = el("div");
      status.id = "rescanStatus";

      button.onclick = async () => {
        button.disabled = true;
        status.textContent = "⏳ Queueing…";
        try {
          const response = await fetch(`${API_URL}/scrape`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              url: page.url,
              rateLimit: parseInt(rateInput.value, 10) || 0,
              screenshot: shotInput.checked,
              downloadImages: imgsInput.checked,
              priority: true,
            }),
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || response.statusText);
          status.textContent = `⏳ Job ${data.jobId} queued with priority…`;
          pollRescan(data.statusUrl, status, button);
        } catch (error) {
          status.textContent = "❌ " + error.message;
          button.disabled = false;
        }
      };

      box.append(button, status);
      section.appendChild(box);
      return section;
    }

    async function pollRescan(statusUrl, status, button) {
      try {
        const job = await (await fetch(API_URL + statusUrl)).json();

        if (job.status === "completed") {
          status.textContent = "✅ Re-scan complete — reloading page data…";
          setTimeout(() => location.reload(), 900);
          return;
        }
        if (job.status === "failed" || job.status === "cancelled") {
          status.textContent = job.status === "failed"
            ? "❌ Re-scan failed: " + job.error
            : "⏹ Re-scan cancelled.";
          button.disabled = false;
          return;
        }

        status.textContent = `⏳ ${job.status}${job.queuePosition != null ? ` (position ${job.queuePosition + 1} in queue)` : ""}…`;
        setTimeout(() => pollRescan(statusUrl, status, button), 1000);
      } catch (error) {
        status.textContent = "❌ Polling error: " + error.message;
        button.disabled = false;
      }
    }

    // --- Link analysis ---------------------------------------------------

    let linkData = null;
    let activeTab = "incoming";
    let hostFilter = null;

    function renderLinks(links) {
      linkData = links;
      const section = el("section");
      section.id = "linksSection";

      const c = links.counts;
      const h2 = el("h2", null, "Link analysis");
      section.appendChild(h2);

      // Summary badges
      const summary = el("p", "note");
      const parts = [];
      if (c.brokenOut) parts.push(`${c.brokenOut} broken outgoing`);
      if (c.notScraped) parts.push(`${c.notScraped} internal target${c.notScraped === 1 ? "" : "s"} not scraped`);
      if (c.nofollow) parts.push(`${c.nofollow} nofollow`);
      if (c.externalHosts) parts.push(`${c.externalHosts} external host${c.externalHosts === 1 ? "" : "s"}`);
      if (c.truncated) parts.push("link list truncated at 500");
      summary.textContent = parts.join(" · ");
      if (parts.length) section.appendChild(summary);

      // Tabs
      const tabs = el("div", "tabs");
      const tabDefs = [
        ["incoming", "Incoming", c.incoming],
        ["internal", "Internal out", c.internal],
        ["external", "External out", c.external],
      ];
      for (const [key, label, count] of tabDefs) {
        const btn = el("button", "tab" + (activeTab === key ? " active" : ""), label);
        const n = el("span", "n", String(count));
        btn.appendChild(n);
        btn.onclick = () => { activeTab = key; hostFilter = null; redrawLinks(); };
        tabs.appendChild(btn);
      }
      section.appendChild(tabs);

      const body = el("div");
      body.id = "linksBody";
      section.appendChild(body);

      setTimeout(redrawLinks, 0);
      return section;
    }

    function redrawLinks() {
      const body = document.getElementById("linksBody");
      if (!body) return;
      body.innerHTML = "";

      if (activeTab === "incoming") return renderIncoming(body);
      if (activeTab === "internal") return renderInternal(body);
      return renderExternal(body);
    }

    function filterBox(placeholder, onFilter) {
      const input = el("input", "linkfilter");
      input.type = "search";
      input.placeholder = placeholder;
      input.oninput = () => onFilter(input.value.trim().toLowerCase());
      return input;
    }

    function anchorCell(texts) {
      const td = el("td");
      if (!texts || texts.length === 0) {
        td.appendChild(el("span", "anchor-none", "(no anchor text)"));
      } else {
        td.appendChild(el("span", "anchor-text", `“${texts[0]}”`));
        if (texts.length > 1) {
          td.append(" ");
          td.appendChild(el("span", "badge b-count", `+${texts.length - 1} more`));
        }
      }
      return td;
    }

    function urlCell(item) {
      const td = el("td", "url");
      if (item.pageUrl) {
        const a = el("a", null, item.url);
        a.href = item.pageUrl;
        a.title = "Open this page's dashboard";
        td.appendChild(a);
      } else {
        td.appendChild(el("span", null, item.url));
      }
      td.append(" ");
      const live = el("a", null, "↗");
      live.href = item.url;
      live.target = "_blank";
      live.rel = "noopener";
      live.title = "Open the live URL";
      td.appendChild(live);
      return td;
    }

    function renderIncoming(body) {
      const rows = linkData.incoming;
      if (rows.length === 0) {
        body.appendChild(el("p", "empty",
          "No pages in this scan link here. Incoming links are recorded by spider crawls — a page with none is an orphan."));
        return;
      }

      body.appendChild(filterBox(`Filter ${rows.length} linking pages…`, q => draw(q)));
      const host = el("div");
      body.appendChild(host);

      function draw(query = "") {
        host.innerHTML = "";
        const shown = rows.filter(r =>
          !query || r.url.toLowerCase().includes(query) ||
          r.anchorTexts.some(t => t.toLowerCase().includes(query)));

        const table = el("table", "links");
        const head = el("tr");
        for (const h of ["Anchor text", "Linking page", "Links", ""]) head.appendChild(el("th", null, h));
        table.appendChild(head);

        for (const r of shown.slice(0, 300)) {
          const tr = el("tr");
          tr.appendChild(anchorCell(r.anchorTexts));
          tr.appendChild(urlCell(r));
          const cnt = el("td");
          if (r.occurrences > 1) cnt.appendChild(el("span", "badge b-count", `${r.occurrences}×`));
          tr.appendChild(cnt);
          const flags = el("td");
          if (r.nofollow) flags.appendChild(el("span", "badge b-nofollow", "nofollow"));
          if (!r.scraped) flags.appendChild(el("span", "badge b-missing", "source not saved"));
          tr.appendChild(flags);
          table.appendChild(tr);
        }
        host.appendChild(table);
        if (shown.length > 300) host.appendChild(el("p", "note", `Showing first 300 of ${shown.length}.`));
        if (shown.length === 0) host.appendChild(el("p", "empty", "No matches."));
      }
      draw();
    }

    function renderInternal(body) {
      const rows = linkData.internal;
      if (rows.length === 0) {
        body.appendChild(el("p", "empty", "This page links to no other pages on the same site."));
        return;
      }

      body.appendChild(filterBox(`Filter ${rows.length} internal links…`, q => draw(q)));
      const host = el("div");
      body.appendChild(host);

      function draw(query = "") {
        host.innerHTML = "";
        const shown = rows.filter(r =>
          !query || r.url.toLowerCase().includes(query) || (r.text || "").toLowerCase().includes(query));

        const table = el("table", "links");
        const head = el("tr");
        for (const h of ["Anchor text", "Target page", "Status", ""]) head.appendChild(el("th", null, h));
        table.appendChild(head);

        for (const r of shown.slice(0, 300)) {
          const tr = el("tr");
          tr.appendChild(anchorCell(r.text ? [r.text] : []));
          tr.appendChild(urlCell(r));

          const status = el("td");
          if (r.broken) status.appendChild(el("span", "badge b-broken", "broken"));
          else if (r.scraped) status.appendChild(el("span", "badge b-ok", "scraped"));
          else status.appendChild(el("span", "badge b-missing", "not scraped"));
          tr.appendChild(status);

          const flags = el("td");
          if (r.nofollow) flags.appendChild(el("span", "badge b-nofollow", "nofollow"));
          if (r.occurrences > 1) flags.appendChild(el("span", "badge b-count", `${r.occurrences}×`));
          tr.appendChild(flags);

          table.appendChild(tr);
        }
        host.appendChild(table);
        if (shown.length > 300) host.appendChild(el("p", "note", `Showing first 300 of ${shown.length}.`));
        if (shown.length === 0) host.appendChild(el("p", "empty", "No matches."));
      }
      draw();
    }

    function renderExternal(body) {
      const rows = linkData.external;
      if (rows.length === 0) {
        body.appendChild(el("p", "empty", "This page links to no external sites."));
        return;
      }

      // Host chips act as filters — "which third parties does this page link to".
      const bar = el("div", "hostbar");
      for (const h of linkData.externalHosts) {
        const chip = el("button", "hostchip" + (hostFilter === h.host ? " active" : ""), `${h.host} (${h.count})`);
        chip.onclick = () => { hostFilter = hostFilter === h.host ? null : h.host; redrawLinks(); };
        bar.appendChild(chip);
      }
      body.appendChild(bar);

      const shown = hostFilter ? rows.filter(r => r.host === hostFilter) : rows;

      const table = el("table", "links");
      const head = el("tr");
      for (const h of ["Anchor text", "External URL", "Host", ""]) head.appendChild(el("th", null, h));
      table.appendChild(head);

      for (const r of shown.slice(0, 300)) {
        const tr = el("tr");
        tr.appendChild(anchorCell(r.text ? [r.text] : []));
        tr.appendChild(urlCell(r));
        tr.appendChild(el("td", null, r.host));
        const flags = el("td");
        if (r.nofollow) flags.appendChild(el("span", "badge b-nofollow", "nofollow"));
        if (r.occurrences > 1) flags.appendChild(el("span", "badge b-count", `${r.occurrences}×`));
        tr.appendChild(flags);
        table.appendChild(tr);
      }
      body.appendChild(table);
      if (shown.length > 300) body.appendChild(el("p", "note", `Showing first 300 of ${shown.length}.`));
    }

    load();
  </script>
</body>
</html>
