<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DeepScrape — Scan Browser</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      margin: 0;
      color: #333;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: #007bff;
      color: white;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    header h1 { font-size: 18px; margin: 0; }
    header a { color: #cfe5ff; text-decoration: none; font-size: 14px; }
    header a:hover { text-decoration: underline; }

    .layout { display: flex; flex: 1; min-height: 0; }

    /* Sidebar */
    aside {
      width: 290px;
      min-width: 220px;
      background: #fff;
      border-right: 1px solid #ddd;
      overflow-y: auto;
      padding: 12px;
    }
    #siteSearch {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
      margin-bottom: 10px;
    }
    .site-group { margin-bottom: 6px; }
    .site-name {
      width: 100%;
      text-align: left;
      background: #f0f4f8;
      border: 1px solid #dbe3ea;
      border-radius: 5px;
      padding: 8px 10px;
      font-size: 14px;
      font-weight: bold;
      color: #234;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .site-name:hover { background: #e4ecf4; }
    .site-name .count {
      font-weight: normal;
      font-size: 12px;
      color: #667;
      background: #fff;
      border-radius: 10px;
      padding: 1px 8px;
    }
    .date-list { list-style: none; margin: 4px 0 4px 0; padding: 0 0 0 12px; }
    .date-list li { margin: 2px 0; }
    .date-btn {
      width: 100%;
      text-align: left;
      background: none;
      border: 1px solid transparent;
      border-radius: 5px;
      padding: 6px 10px;
      font-size: 14px;
      color: #007bff;
      cursor: pointer;
    }
    .date-btn:hover { background: #eef5ff; }
    .date-btn.active {
      background: #007bff;
      color: white;
    }
    .collapsed .date-list { display: none; }

    /* Main panel */
    main { flex: 1; overflow-y: auto; padding: 20px; }
    .placeholder { color: #888; text-align: center; margin-top: 60px; font-size: 15px; }

    .scan-header h2 { margin: 0 0 4px 0; font-size: 22px; color: #234; }
    .scan-header .meta { color: #666; font-size: 14px; margin-bottom: 14px; }

    .stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .stat {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px 16px;
      min-width: 110px;
      text-align: center;
    }
    .stat .num { font-size: 22px; font-weight: bold; color: #007bff; }
    .stat .label { font-size: 12px; color: #667; }

    .artifacts { margin-bottom: 16px; font-size: 14px; }
    .artifacts a {
      display: inline-block;
      margin-right: 10px;
      margin-bottom: 6px;
      background: #fff;
      border: 1px solid #cfe0f0;
      border-radius: 5px;
      padding: 5px 10px;
      color: #007bff;
      text-decoration: none;
    }
    .artifacts a:hover { background: #eef5ff; }

    table.pages {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.06);
    }
    table.pages th, table.pages td {
      padding: 10px 12px;
      border-bottom: 1px solid #eee;
      text-align: left;
      font-size: 14px;
      vertical-align: middle;
    }
    table.pages th { background: #f0f4f8; color: #234; }
    table.pages a { color: #007bff; text-decoration: none; font-weight: bold; }
    table.pages a:hover { text-decoration: underline; }
    .thumb {
      width: 120px;
      height: 68px;
      object-fit: cover;
      object-position: top;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fafafa;
      cursor: pointer;
    }
    .muted { color: #aaa; font-weight: normal; }

    /* Lightbox for screenshot preview */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 10;
      justify-content: center;
      align-items: flex-start;
      overflow-y: auto;
      padding: 30px;
      cursor: zoom-out;
    }
    #lightbox img { max-width: 95%; border-radius: 6px; box-shadow: 0 4px 30px rgba(0,0,0,0.5); }

    @media (max-width: 700px) {
      .layout { flex-direction: column; }
      aside { width: 100%; max-height: 40vh; }
    }
  </style>
</head>
<body>

  <header>
    <h1>DeepScrape — Scan Browser</h1>
    <a href="/scan.html">➕ New scan</a>
  </header>

  <div class="layout">
    <aside>
      <input type="search" id="siteSearch" placeholder="Filter sites…" oninput="renderSidebar()">
      <div id="siteList">Loading…</div>
    </aside>

    <main id="mainPanel">
      <p class="placeholder">Select a site and scan date on the left to view its pages.</p>
    </main>
  </div>

  <div id="lightbox" onclick="this.style.display='none'"><img id="lightboxImg" alt="Screenshot preview"></div>

  <script>
    // Same-origin: the API serves this page, so relative URLs always work.
    const API_URL = "";

    /** @type {Record<string, string[]>} domain -> dates (latest first) */
    let sites = {};
    let activeScan = null;
    const expanded = new Set();

    async function loadScans() {
      try {
        const response = await fetch(`${API_URL}/scans`);
        if (!response.ok) throw new Error("Failed to fetch scans");
        const data = await response.json();

        sites = {};
        for (const scan of data.scans || []) {
          const [domain, date] = scan.split("/");
          if (!domain || !date) continue;
          (sites[domain] ??= []).push(date);
        }
        // Dates newest first within each site.
        Object.values(sites).forEach(dates => dates.sort((a, b) => b.localeCompare(a)));

        // Expand all sites by default when there are few of them.
        if (Object.keys(sites).length <= 6) {
          Object.keys(sites).forEach(d => expanded.add(d));
        }

        renderSidebar();
      } catch (error) {
        document.getElementById("siteList").textContent = "Error: " + error.message;
      }
    }

    function renderSidebar() {
      const filter = document.getElementById("siteSearch").value.trim().toLowerCase();
      const container = document.getElementById("siteList");
      container.innerHTML = "";

      const domains = Object.keys(sites)
        .filter(d => d.toLowerCase().includes(filter))
        .sort();

      if (domains.length === 0) {
        container.textContent = filter ? "No sites match." : "No scans yet — run one from “New scan”.";
        return;
      }

      for (const domain of domains) {
        const group = document.createElement("div");
        group.className = "site-group" + (expanded.has(domain) ? "" : " collapsed");

        const btn = document.createElement("button");
        btn.className = "site-name";
        btn.innerHTML = `<span></span><span class="count"></span>`;
        btn.firstChild.textContent = domain;
        btn.lastChild.textContent = sites[domain].length;
        btn.onclick = () => {
          expanded.has(domain) ? expanded.delete(domain) : expanded.add(domain);
          renderSidebar();
        };
        group.appendChild(btn);

        const list = document.createElement("ul");
        list.className = "date-list";
        for (const date of sites[domain]) {
          const li = document.createElement("li");
          const dateBtn = document.createElement("button");
          dateBtn.className = "date-btn" + (activeScan === `${domain}/${date}` ? " active" : "");
          dateBtn.textContent = `📅 ${date}`;
          dateBtn.onclick = () => selectScan(domain, date);
          li.appendChild(dateBtn);
          list.appendChild(li);
        }
        group.appendChild(list);
        container.appendChild(group);
      }
    }

    async function selectScan(domain, date) {
      activeScan = `${domain}/${date}`;
      expanded.add(domain);
      renderSidebar();

      const main = document.getElementById("mainPanel");
      main.innerHTML = `<p class="placeholder">Loading ${activeScan}…</p>`;

      try {
        const response = await fetch(`${API_URL}/scan/all?scan=${encodeURIComponent(activeScan)}`);
        if (!response.ok) throw new Error("Failed to fetch scan files");
        const data = await response.json();
        renderScan(domain, date, data.files || []);
      } catch (error) {
        main.innerHTML = "";
        const p = document.createElement("p");
        p.className = "placeholder";
        p.textContent = "Error: " + error.message;
        main.appendChild(p);
      }
    }

    function renderScan(domain, date, files) {
      const main = document.getElementById("mainPanel");
      main.innerHTML = "";

      const webps = new Set(files.filter(f => f.endsWith(".webp")));
      const htmlPages = files.filter(f => f.endsWith(".html"));
      const images = files.filter(f => /\/images\//.test(f));
      const artifactNames = ["all-links.txt", "broken-links.txt", "incoming-links.json"];
      const artifacts = files.filter(f => artifactNames.includes(f.split("/").pop()));

      // Header
      const headerDiv = document.createElement("div");
      headerDiv.className = "scan-header";
      const h2 = document.createElement("h2");
      h2.textContent = domain;
      const meta = document.createElement("p");
      meta.className = "meta";
      meta.textContent = `Scan date: ${date}`;
      headerDiv.append(h2, meta);
      main.appendChild(headerDiv);

      // Stats
      const stats = document.createElement("div");
      stats.className = "stats";
      const statDefs = [
        [htmlPages.length, "Pages"],
        [webps.size, "Screenshots"],
        [images.length, "Images"],
        [artifacts.length, "Crawl artifacts"],
      ];
      for (const [num, label] of statDefs) {
        const s = document.createElement("div");
        s.className = "stat";
        const n = document.createElement("div"); n.className = "num"; n.textContent = num;
        const l = document.createElement("div"); l.className = "label"; l.textContent = label;
        s.append(n, l);
        stats.appendChild(s);
      }
      main.appendChild(stats);

      // Spider artifacts
      if (artifacts.length) {
        const art = document.createElement("div");
        art.className = "artifacts";
        for (const f of artifacts) {
          const a = document.createElement("a");
          a.href = `/output/${f}`;
          a.target = "_blank";
          a.textContent = "🗂 " + f.split("/").pop();
          art.appendChild(a);
        }
        main.appendChild(art);
      }

      // Pages table
      if (htmlPages.length === 0) {
        const p = document.createElement("p");
        p.className = "placeholder";
        p.textContent = "No saved pages in this scan.";
        main.appendChild(p);
        return;
      }

      const table = document.createElement("table");
      table.className = "pages";
      table.innerHTML = `<tr><th>Preview</th><th>Page</th><th>Links</th></tr>`;

      for (const file of htmlPages) {
        const fileUrl = `/output/${file}`;
        const webpFile = file.replace(/\.html?$/i, ".webp");
        const hasShot = webps.has(webpFile);

        // Page path relative to the scan's domain folder, for display.
        const displayPath = "/" + file.split("/").slice(3).join("/");

        const row = document.createElement("tr");

        const tdPreview = document.createElement("td");
        if (hasShot) {
          const img = document.createElement("img");
          img.className = "thumb";
          img.loading = "lazy";
          img.src = `/output/${webpFile}`;
          img.alt = `Screenshot of ${displayPath}`;
          img.onclick = () => showLightbox(`/output/${webpFile}`);
          tdPreview.appendChild(img);
        } else {
          tdPreview.innerHTML = `<span class="muted">—</span>`;
        }

        const tdName = document.createElement("td");
        tdName.textContent = displayPath;

        const tdLinks = document.createElement("td");
        const aHtml = document.createElement("a");
        aHtml.href = fileUrl;
        aHtml.target = "_blank";
        aHtml.textContent = "HTML";
        tdLinks.appendChild(aHtml);
        if (hasShot) {
          tdLinks.append(" · ");
          const aShot = document.createElement("a");
          aShot.href = `/output/${webpFile}`;
          aShot.target = "_blank";
          aShot.textContent = "Screenshot";
          tdLinks.appendChild(aShot);
        }

        row.append(tdPreview, tdName, tdLinks);
        table.appendChild(row);
      }
      main.appendChild(table);
    }

    function showLightbox(src) {
      document.getElementById("lightboxImg").src = src;
      document.getElementById("lightbox").style.display = "flex";
    }

    loadScans();
  </script>
</body>
</html>
