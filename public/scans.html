<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DeepScrape — Scan Browser</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      margin: 0;
      color: #333;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: #007bff;
      color: white;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    header h1 { font-size: 18px; margin: 0; }
    header a { color: #cfe5ff; text-decoration: none; font-size: 14px; }
    header a:hover { text-decoration: underline; }

    .layout { display: flex; flex: 1; min-height: 0; }

    /* Sidebar */
    aside {
      width: 290px;
      min-width: 220px;
      background: #fff;
      border-right: 1px solid #ddd;
      overflow-y: auto;
      padding: 12px;
    }
    #siteSearch {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
      margin-bottom: 10px;
    }
    .site-group { margin-bottom: 6px; }
    .site-name {
      width: 100%;
      text-align: left;
      background: #f0f4f8;
      border: 1px solid #dbe3ea;
      border-radius: 5px;
      padding: 8px 10px;
      font-size: 14px;
      font-weight: bold;
      color: #234;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .site-name:hover { background: #e4ecf4; }
    .site-name .count {
      font-weight: normal;
      font-size: 12px;
      color: #667;
      background: #fff;
      border-radius: 10px;
      padding: 1px 8px;
    }
    .date-list { list-style: none; margin: 4px 0 4px 0; padding: 0 0 0 12px; }
    .date-list li { margin: 2px 0; }
    .date-btn {
      width: 100%;
      text-align: left;
      background: none;
      border: 1px solid transparent;
      border-radius: 5px;
      padding: 6px 10px;
      font-size: 14px;
      color: #007bff;
      cursor: pointer;
    }
    .date-btn:hover { background: #eef5ff; }
    .date-btn.active {
      background: #007bff;
      color: white;
    }
    .collapsed .date-list { display: none; }

    /* Main panel */
    main { flex: 1; overflow-y: auto; padding: 20px; }
    .placeholder { color: #888; text-align: center; margin-top: 60px; font-size: 15px; }

    .scan-header h2 { margin: 0 0 4px 0; font-size: 22px; color: #234; }
    .scan-header .meta { color: #666; font-size: 14px; margin-bottom: 14px; }

    .stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .stat {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px 16px;
      min-width: 110px;
      text-align: center;
    }
    .stat .num { font-size: 22px; font-weight: bold; color: #007bff; }
    .stat .label { font-size: 12px; color: #667; }

    .artifacts { margin-bottom: 16px; font-size: 14px; }
    .artifacts a {
      display: inline-block;
      margin-right: 10px;
      margin-bottom: 6px;
      background: #fff;
      border: 1px solid #cfe0f0;
      border-radius: 5px;
      padding: 5px 10px;
      color: #007bff;
      text-decoration: none;
    }
    .artifacts a:hover { background: #eef5ff; }

    /* Page tree */
    #pageFilter {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
      margin-bottom: 10px;
    }
    .tree {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px 14px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.06);
      font-size: 14px;
      line-height: 1.9;
    }
    .tree details { padding-left: 18px; }
    .tree > details { padding-left: 0; }
    .tree summary {
      cursor: pointer;
      font-weight: bold;
      color: #234;
      list-style-position: outside;
      user-select: none;
    }
    .tree summary:hover { color: #007bff; }
    .tree summary .count {
      font-weight: normal;
      font-size: 12px;
      color: #667;
      background: #f0f4f8;
      border-radius: 10px;
      padding: 1px 8px;
      margin-left: 6px;
    }
    .tree .page-row { padding-left: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tree > .page-row { padding-left: 0; }
    .tree .page-row a { color: #007bff; text-decoration: none; }
    .tree .page-row a:hover { text-decoration: underline; }
    .page-icon { margin-right: 4px; }
    .result-count { color: #667; font-size: 13px; margin: 4px 0 8px; }
    .muted { color: #aaa; font-weight: normal; }

    /* Lightbox for screenshot preview */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 10;
      justify-content: center;
      align-items: flex-start;
      overflow-y: auto;
      padding: 30px;
      cursor: zoom-out;
    }
    #lightbox img { max-width: 95%; border-radius: 6px; box-shadow: 0 4px 30px rgba(0,0,0,0.5); }

    @media (max-width: 700px) {
      .layout { flex-direction: column; }
      aside { width: 100%; max-height: 40vh; }
    }
  </style>
</head>
<body>

  <header>
    <h1>DeepScrape — Scan Browser</h1>
    <a href="/scan.html">➕ New scan</a>
  </header>

  <div class="layout">
    <aside>
      <input type="search" id="siteSearch" placeholder="Filter sites…" oninput="renderSidebar()">
      <div id="siteList">Loading…</div>
    </aside>

    <main id="mainPanel">
      <p class="placeholder">Select a site and scan date on the left to view its pages.</p>
    </main>
  </div>

  <div id="lightbox" onclick="this.style.display='none'"><img id="lightboxImg" alt="Screenshot preview"></div>

  <script>
    // Same-origin: the API serves this page, so relative URLs always work.
    const API_URL = "";

    /** @type {Record<string, string[]>} domain -> dates (latest first) */
    let sites = {};
    let activeScan = null;
    const expanded = new Set();

    async function loadScans() {
      try {
        const response = await fetch(`${API_URL}/scans`);
        if (!response.ok) throw new Error("Failed to fetch scans");
        const data = await response.json();

        sites = {};
        for (const scan of data.scans || []) {
          const [domain, date] = scan.split("/");
          if (!domain || !date) continue;
          (sites[domain] ??= []).push(date);
        }
        // Dates newest first within each site.
        Object.values(sites).forEach(dates => dates.sort((a, b) => b.localeCompare(a)));

        // Expand all sites by default when there are few of them.
        if (Object.keys(sites).length <= 6) {
          Object.keys(sites).forEach(d => expanded.add(d));
        }

        renderSidebar();
      } catch (error) {
        document.getElementById("siteList").textContent = "Error: " + error.message;
      }
    }

    function renderSidebar() {
      const filter = document.getElementById("siteSearch").value.trim().toLowerCase();
      const container = document.getElementById("siteList");
      container.innerHTML = "";

      const domains = Object.keys(sites)
        .filter(d => d.toLowerCase().includes(filter))
        .sort();

      if (domains.length === 0) {
        container.textContent = filter ? "No sites match." : "No scans yet — run one from “New scan”.";
        return;
      }

      for (const domain of domains) {
        const group = document.createElement("div");
        group.className = "site-group" + (expanded.has(domain) ? "" : " collapsed");

        const btn = document.createElement("button");
        btn.className = "site-name";
        btn.innerHTML = `<span></span><span class="count"></span>`;
        btn.firstChild.textContent = domain;
        btn.lastChild.textContent = sites[domain].length;
        btn.onclick = () => {
          expanded.has(domain) ? expanded.delete(domain) : expanded.add(domain);
          renderSidebar();
        };
        group.appendChild(btn);

        const list = document.createElement("ul");
        list.className = "date-list";
        for (const date of sites[domain]) {
          const li = document.createElement("li");
          const dateBtn = document.createElement("button");
          dateBtn.className = "date-btn" + (activeScan === `${domain}/${date}` ? " active" : "");
          dateBtn.textContent = `📅 ${date}`;
          dateBtn.onclick = () => selectScan(domain, date);
          li.appendChild(dateBtn);
          list.appendChild(li);
        }
        group.appendChild(list);
        container.appendChild(group);
      }
    }

    /** Tree data of the currently selected scan (for the filter box). */
    let currentTree = null;

    async function selectScan(domain, date) {
      activeScan = `${domain}/${date}`;
      expanded.add(domain);
      renderSidebar();

      const main = document.getElementById("mainPanel");
      main.innerHTML = `<p class="placeholder">Loading ${activeScan}…</p>`;

      try {
        const response = await fetch(`${API_URL}/scan/tree?scan=${encodeURIComponent(activeScan)}`);
        if (!response.ok) throw new Error("Failed to fetch scan tree");
        const data = await response.json();
        renderScan(domain, date, data);
      } catch (error) {
        main.innerHTML = "";
        const p = document.createElement("p");
        p.className = "placeholder";
        p.textContent = "Error: " + error.message;
        main.appendChild(p);
      }
    }

    function renderScan(domain, date, data) {
      const main = document.getElementById("mainPanel");
      main.innerHTML = "";
      currentTree = data.tree;

      // Header
      const headerDiv = document.createElement("div");
      headerDiv.className = "scan-header";
      const h2 = document.createElement("h2");
      h2.textContent = domain;
      const meta = document.createElement("p");
      meta.className = "meta";
      meta.textContent = `Scan date: ${date}`;
      headerDiv.append(h2, meta);
      main.appendChild(headerDiv);

      // Stats
      const stats = document.createElement("div");
      stats.className = "stats";
      const statDefs = [
        [data.stats.pages, "Pages"],
        [data.stats.screenshots, "Screenshots"],
        [data.stats.images, "Images"],
        [data.stats.brokenLinks, "Broken links"],
      ];
      for (const [num, label] of statDefs) {
        const s = document.createElement("div");
        s.className = "stat";
        const n = document.createElement("div"); n.className = "num"; n.textContent = num;
        const l = document.createElement("div"); l.className = "label"; l.textContent = label;
        s.append(n, l);
        stats.appendChild(s);
      }
      main.appendChild(stats);

      // Spider artifacts
      if (data.stats.artifacts.length) {
        const art = document.createElement("div");
        art.className = "artifacts";
        for (const f of data.stats.artifacts) {
          const a = document.createElement("a");
          a.href = `/output/${activeScan}/${f}`;
          a.target = "_blank";
          a.textContent = "🗂 " + f.split("/").pop();
          art.appendChild(a);
        }
        main.appendChild(art);
      }

      if (data.stats.pages === 0) {
        const p = document.createElement("p");
        p.className = "placeholder";
        p.textContent = "No saved pages in this scan.";
        main.appendChild(p);
        return;
      }

      // Page filter
      const filter = document.createElement("input");
      filter.type = "search";
      filter.id = "pageFilter";
      filter.placeholder = `Filter ${data.stats.pages} pages…`;
      filter.oninput = () => renderTreePanel(filter.value.trim().toLowerCase());
      main.appendChild(filter);

      const treeHost = document.createElement("div");
      treeHost.id = "treeHost";
      main.appendChild(treeHost);

      renderTreePanel("");
    }

    function pageLink(node) {
      const div = document.createElement("div");
      div.className = "page-row";
      const a = document.createElement("a");
      a.href = `/page.html?scan=${encodeURIComponent(activeScan)}&path=${encodeURIComponent(node.path)}`;
      const icon = document.createElement("span");
      icon.className = "page-icon";
      icon.textContent = "📄";
      a.append(icon, document.createTextNode(node.name));
      a.title = node.path;
      div.appendChild(a);
      return div;
    }

    /**
     * Renders one directory as a <details> element. Children are only
     * built into the DOM on first expand, so a 3000-page site renders
     * instantly as collapsed folders with counts.
     */
    function dirNode(node, openDepth) {
      const details = document.createElement("details");
      const summary = document.createElement("summary");
      summary.append(document.createTextNode("📁 " + node.name));
      const count = document.createElement("span");
      count.className = "count";
      count.textContent = node.pages;
      summary.appendChild(count);
      details.appendChild(summary);

      let built = false;
      const build = () => {
        if (built) return;
        built = true;
        for (const child of node.children) {
          details.appendChild(child.type === "page" ? pageLink(child) : dirNode(child, 0));
        }
      };
      details.addEventListener("toggle", () => { if (details.open) build(); });

      if (openDepth > 0) {
        details.open = true;
        build();
        // Auto-descend single-directory chains (e.g. the domain folder).
        const onlyDirs = node.children.filter(c => c.type === "dir");
        if (onlyDirs.length === 1 && node.children.length === 1) {
          details.querySelector("details")?.setAttribute("open", "");
        }
      }
      return details;
    }

    function renderTreePanel(query) {
      const host = document.getElementById("treeHost");
      host.innerHTML = "";

      const container = document.createElement("div");
      container.className = "tree";

      if (query.length >= 2) {
        // Flat search across every page in the scan.
        const matches = [];
        (function walk(node) {
          for (const child of node.children ?? []) {
            if (child.type === "page") {
              if (child.path.toLowerCase().includes(query)) matches.push(child);
            } else {
              walk(child);
            }
          }
        })(currentTree);

        const info = document.createElement("p");
        info.className = "result-count";
        info.textContent = matches.length === 0
          ? "No pages match."
          : `${matches.length} matching page${matches.length === 1 ? "" : "s"}${matches.length > 300 ? " (showing first 300)" : ""}`;
        host.appendChild(info);

        for (const m of matches.slice(0, 300)) {
          const row = pageLink(m);
          row.firstChild.lastChild.textContent = m.path; // show full path in results
          container.appendChild(row);
        }
      } else {
        for (const child of currentTree.children) {
          container.appendChild(child.type === "page" ? pageLink(child) : dirNode(child, 1));
        }
      }

      host.appendChild(container);
    }

    loadScans();
  </script>
</body>
</html>
