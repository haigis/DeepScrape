# DeepScrape scanner — Fly.io, London. Internal service: only the
# Coherence app should reach it (use Fly private networking /
# .internal DNS rather than a public host once both live in one org).
# One-time setup:
#   fly launch --no-deploy
#   fly volumes create deepscrape_output --region lhr --size 10
# Pushes to main deploy via GitHub Actions (FLY_API_TOKEN repo secret).

app = "deepscrape"
primary_region = "lhr"

[build]

[http_service]
  internal_port = 5700
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = "deepscrape_output"
  destination = "/data"

[[vm]]
  # Puppeteer wants headroom; concurrent scans (MAX_CONCURRENT_JOBS=3)
  # each open pages in one shared browser.
  size = "shared-cpu-2x"
  memory = "4gb"
