# VPS deployment via Forgejo Actions (https://git.ac0rn.io).
#
#   push to dev  -> staging  https://staging-deepscrape.ac0rn.io  (basic-auth)
#   push to main -> prod     https://deepscrape.ac0rn.io          (basic-auth)
#   coherence-<env> reaches deepscrape-<env>:5700 directly on the docker network.
#
# Roll back / roll forward (Actions -> "Deploy (VPS)" -> Run workflow):
#   environment: staging|prod
#   ref:         any commit SHA / tag / branch to deploy.  If that commit's
#                image already exists in the VPS's local docker store it is
#                re-used (no rebuild), so rolling back to a previously
#                deployed commit takes ~30s.  The literal word "previous"
#                swaps back to the image that was running before the last
#                deploy, without touching git at all.
#
# From the CLI (token in /opt/stacks/git/.secrets on the VPS):
#   curl -X POST -H "Authorization: token $FJ_TOKEN" \
#     -H "Content-Type: application/json" \
#     -d '{"ref":"dev","inputs":{"environment":"staging","ref":"<sha|previous>"}}' \
#     https://git.ac0rn.io/api/v1/repos/mark/DeepScrape/actions/workflows/deploy-vps.yml/dispatches
#
# Repo secrets required:
#   DEPLOY_HOST         VPS address
#   DEPLOY_KNOWN_HOSTS  ssh-keyscan output for the host
#   DEPLOY_SSH_KEY      private half of the command-restricted deploy key
#
# The deploy key can ONLY run `deploy <project> <env> <image|rollback>`
# server-side; it cannot open a shell even if this secret leaks.

name: Deploy (VPS)

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, prod]
        required: true
      ref:
        description: "Commit SHA / tag / branch to deploy, or 'previous' to roll back one step. Empty = the branch you run this from."
        required: false
        default: ""

env:
  PROJECT: deepscrape
  IMAGE_REPO: git.ac0rn.io/mark/deepscrape

jobs:
  resolve:
    runs-on: [self-hosted, vps]
    outputs:
      env: ${{ steps.t.outputs.env }}
      url: ${{ steps.t.outputs.url }}
      sha: ${{ steps.t.outputs.sha }}
      image: ${{ steps.t.outputs.image }}
      rollback: ${{ steps.t.outputs.rollback }}
    steps:
      - id: t
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ inputs.environment }}"
            REF="${{ inputs.ref }}"
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            ENV=prod; REF="$GITHUB_SHA"
          else
            ENV=staging; REF="$GITHUB_SHA"
          fi
          [ -n "$REF" ] || REF="$GITHUB_SHA"
          if [ "$ENV" = "prod" ]; then URL="https://deepscrape.ac0rn.io/"; else URL="https://staging-deepscrape.ac0rn.io/"; fi
          ROLLBACK=false; SHA=""; IMAGE=rollback
          if [ "$REF" = "previous" ]; then
            ROLLBACK=true
          else
            # Accept a branch, tag, or short/full SHA; pin to the full SHA
            # via the Forgejo API.
            SHA="$(curl -sfG -H "Authorization: token ${{ github.token }}" \
              --data-urlencode "sha=$REF" --data-urlencode "limit=1" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits" | jq -re '.[0].sha')"
            IMAGE="${IMAGE_REPO}:${SHA::12}"
          fi
          {
            echo "env=$ENV"; echo "url=$URL"; echo "sha=$SHA"; echo "image=$IMAGE"; echo "rollback=$ROLLBACK"
          } >> "$GITHUB_OUTPUT"
          echo "target: $ENV  ref: $REF  sha: $SHA  image: $IMAGE  rollback: $ROLLBACK"

  deploy:
    needs: resolve
    runs-on: [self-hosted, vps]
    # One deploy at a time per environment; queued, never cancelled.
    concurrency:
      group: deploy-vps-${{ needs.resolve.outputs.env }}
      cancel-in-progress: false
    steps:
      # Re-use an already-built image for this commit (roll back / forward).
      # The runner and the deploy host are the same machine, so the local
      # image store is the registry.
      - name: Check for an existing image
        id: exists
        if: needs.resolve.outputs.rollback == 'false'
        run: |
          if docker image inspect "${{ needs.resolve.outputs.image }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "image already built locally — skipping build"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"; echo "image not present — building"
          fi

      - uses: actions/checkout@v4
        if: needs.resolve.outputs.rollback == 'false' && steps.exists.outputs.exists == 'false'
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: docker/setup-buildx-action@v3
        if: needs.resolve.outputs.rollback == 'false' && steps.exists.outputs.exists == 'false'
        with:
          # Persistent builder on the VPS runner: its container carries the
          # layer cache between runs, replacing the gha cache backend.
          name: vps-builder-deepscrape

      - name: Build (into the local image store)
        if: needs.resolve.outputs.rollback == 'false' && steps.exists.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ needs.resolve.outputs.image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.resolve.outputs.sha }}

      - name: Deploy to VPS
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/dk
          chmod 600 ~/.ssh/dk
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          # Single line, command in one variable: forgejo-runner mangled the
          # backslash-continued form and ssh arrived with no remote command.
          CMD="deploy ${PROJECT} ${{ needs.resolve.outputs.env }} ${{ needs.resolve.outputs.image }}"
          echo "sending: $CMD"
          ssh -i ~/.ssh/dk -o BatchMode=yes -o StrictHostKeyChecking=yes "ubuntu@${{ secrets.DEPLOY_HOST }}" "$CMD"

      - name: Smoke test
        run: |
          URL="${{ needs.resolve.outputs.url }}"
          for i in $(seq 1 15); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$URL" || true)
            echo "attempt $i: HTTP $CODE"
            # 401 = Caddy basic-auth answered, which means the upstream is wired.
            case "$CODE" in 2*|3*|401) echo "smoke test passed"; exit 0 ;; esac
            sleep 10
          done
          echo "smoke test FAILED — server already rolled back if the container was unhealthy; check deploy output above" >&2
          exit 1
